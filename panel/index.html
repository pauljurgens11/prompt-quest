<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --stone: #4a3f31; --stone-hi: #6b5a43; --stone-lo: #2a231a; --tile: #3a3126;
    --tile-hi: var(--tile-hi); --tile-lo: #1d1812; --gold: #ffd84a; --yellow: #ffff3a;
    --orange: #ff9a1f; --text: #f3e6c4; --green: #3fd16a;
    /* everything below is restyled by the equipped skin (skills.json drops[kind=skin].vars) */
    --accent: #ffd84a; --accent-rgb: 255,216,74; --accent-hi: #ffe58a; --accent-lo: #e0a826; --accent-ink: #1d1405;
    --ink: #080603; --ink-rgb: 18,14,9; --muted: #c9b993; --muted-2: #a8987a; --xp-a: #57e07a; --xp-b: #1f9a42;
    --bar-bg: transparent; --bar-edge: transparent; --stone-end: #3f3528; --tile-end: #2f281f; --aura: transparent;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  body { font-family: "VT323", "Menlo", monospace; color: var(--text); }
  .panel {
    padding: 6px; border-radius: 6px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.05) 0 2px, transparent 3px) 0 0/13px 11px,
      radial-gradient(circle at 70% 60%, rgba(0,0,0,.12) 0 2px, transparent 3px) 0 0/17px 15px,
      linear-gradient(180deg, var(--stone-hi), var(--stone) 30%, var(--stone-end));
    border: 2px solid var(--stone-lo);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.18), inset -1px -1px 0 rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.45);
  }
  .bar { background: var(--bar-bg); border-bottom: 1px solid var(--bar-edge); margin: -6px -6px 1px; padding: 6px 8px 3px !important; border-radius: 4px 4px 0 0; }
  .bar { height: 18px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px; }
  .title { color: var(--orange); font-size: 17px; text-shadow: 1px 1px 0 #000; letter-spacing: .5px; }
  .btn { color: var(--text); opacity: .55; font-size: 13px; width: 14px; text-align: center; text-shadow: 1px 1px 0 #000; }
  .btn:hover { opacity: 1; color: var(--yellow); }
  .inset { background: rgba(var(--ink-rgb),.78); border: 1px solid #000; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }


  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .tile { position: relative; height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 5px 0 4px;
          background: linear-gradient(180deg, var(--tile-hi), var(--tile) 45%, var(--tile-end));
          border: 1px solid var(--tile-lo); border-radius: 3px;
          box-shadow: inset 1px 1px 0 rgba(255,255,255,.12), inset -1px -1px 0 rgba(0,0,0,.4); }
  .tile:hover { filter: brightness(1.18); }
  .icon { font-size: 17px; width: 22px; text-align: center; filter: drop-shadow(1px 1px 0 #000) saturate(.85); }
  .lv { flex: 1; position: relative; height: 26px; }
  .lv .a, .lv .b { position: absolute; font-size: 18px; color: var(--yellow); text-shadow: 1px 1px 0 #000; line-height: 1; }
  .lv .a { top: 1px; left: 2px; } .lv .b { bottom: 0; right: 0; }
  .lv .slash { position: absolute; left: 50%; top: 50%; width: 1px; height: 22px; background: rgba(0,0,0,.55);
               transform: translate(-50%, -50%) rotate(35deg); box-shadow: 1px 0 0 rgba(255,255,255,.12); }
  .today { position: absolute; top: 2px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 4px var(--green); }
  .tile.total { justify-content: center; flex-direction: column; gap: 0; }
  .tile.total .k { font-size: 12px; white-space: nowrap; color: var(--yellow); text-shadow: 1px 1px 0 #000; }
  .tile.total .v { font-size: 18px; color: var(--yellow); text-shadow: 1px 1px 0 #000; line-height: 1; }

  .info { margin-top: 5px; padding: 5px 6px; font-size: 15px; line-height: 1.1; }
  .info .name { color: var(--orange); font-size: 16px; text-shadow: 1px 1px 0 #000; }
  .info .row { display: flex; justify-content: space-between; text-shadow: 1px 1px 0 #000; }
  .info .row span:last-child { color: var(--yellow); }
  .info .about { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .xpbar { height: 7px; margin-top: 3px; background: #2a0d0d; border: 1px solid #000; position: relative; }
  .xpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, var(--xp-a), var(--xp-b)); }
  .compact .grid, .compact .info, .compact #tray, .compact #buddy { display: none !important; }
  .levelup { animation: flash 1.2s ease-out 3; }
  @keyframes flash { 0% { box-shadow: 0 0 0 2px var(--gold), 0 0 16px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .banner { position: fixed; left: 6px; right: 6px; top: 26px; padding: 8px; text-align: center; border-radius: 3px; z-index: 5;
            background: rgba(12,9,5,.94); border: 1px solid var(--gold); color: var(--yellow); text-shadow: 1px 1px 0 #000;
            font-size: 15px; opacity: 0; transform: translateY(-6px); transition: all .25s; pointer-events: none; }
  .banner.show { opacity: 1; transform: none; }
  .banner .big { font-size: 20px; color: var(--orange); }

  /* ---- loot: chips, tray, overlay, unboxing, bag ---- */
  .bar { gap: 4px; }
  /* a long equipped title keeps its line; the chips drop to a second row instead of clipping */
  .bar { height: auto; min-height: 18px; flex-wrap: wrap; row-gap: 3px; }
  .bar .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .bar .right { display: flex; align-items: center; margin-left: auto; }
  #chips { display: flex; gap: 3px; margin-right: 4px; }
  .chip { font-size: 14px; color: var(--yellow); text-shadow: 1px 1px 0 #000; padding: 0 4px; height: 16px; line-height: 16px;
          background: rgba(0,0,0,.35); border: 1px solid #000; border-radius: 3px; white-space: nowrap; }
  .chip.warn { color: #ffb4a0; }
  .chip.boost { color: #9dffb5; animation: pulse 1.6s infinite; }
  .btn2 { cursor: pointer; } .btn2:hover { background: rgba(var(--accent-rgb),.25); }
  .flame { display: inline-block; font-size: 11px; }
  .flame.f1 { font-size: 13px; animation: flick .5s infinite alternate; }
  .flame.f2 { font-size: 15px; animation: flick .4s infinite alternate; filter: drop-shadow(0 0 3px #ff8a00); }
  .flame.f3 { font-size: 16px; animation: flick .35s infinite alternate; filter: hue-rotate(190deg) drop-shadow(0 0 4px #4fc3ff); }
  @keyframes flick { to { transform: translateY(-1px) scale(1.08); } }

  #tray { display: none; align-items: center; gap: 6px; padding: 4px 6px; margin-bottom: 4px; cursor: pointer; position: relative; overflow: hidden;
          background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, var(--tile)), var(--stone-lo)); border: 1px solid #000; border-radius: 3px;
          box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),.35), 0 0 8px rgba(var(--accent-rgb),.35); animation: trayGlow 1.8s ease-in-out infinite; }
  #tray::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px; left: -60px;
                 background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation: sweep 2.6s ease-in-out infinite; }
  @keyframes sweep { 60%, 100% { left: 110%; } }
  @keyframes trayGlow { 50% { box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),.6), 0 0 14px rgba(var(--accent-rgb),.6); } }
  #tray .mini { width: 30px; height: 26px; animation: bob 1.2s ease-in-out infinite; }
  #tray .mini svg { width: 100%; height: 100%; }
  @keyframes bob { 50% { transform: translateY(-2px) rotate(-3deg); } }
  .trayText { flex: 1; font-size: 15px; line-height: 1; color: var(--text); text-shadow: 1px 1px 0 #000; }
  .meter { height: 6px; margin-top: 3px; background: var(--ink); border: 1px solid #000; position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi)); box-shadow: 0 0 6px var(--accent); }
  #tray.idle { cursor: default; animation: none; box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),.15); }
  #tray.idle::after { display: none; }
  .trayText b { color: var(--yellow); font-weight: normal; } .trayText small { font-size: 12px; color: var(--muted); }
  .openBtn, .gb { font-size: 15px; color: var(--accent-ink); background: linear-gradient(180deg, var(--accent-hi), var(--accent-lo)); border: 1px solid #000;
                 border-radius: 3px; padding: 1px 8px; box-shadow: inset 0 1px 0 #fff6c8; cursor: pointer; white-space: nowrap; }
  .gb:hover, .openBtn:hover { filter: brightness(1.15); }
  .gb.alt { background: linear-gradient(180deg, #8fc8ff, #3b7fd6); }
  .gb.sm { font-size: 13px; padding: 0 6px; } .gb.dis { filter: grayscale(1) brightness(.6); cursor: default; }

  .overlay { position: fixed; inset: 0; z-index: 10; display: none; background: var(--ink); border-radius: 6px; overflow: hidden; }
  .overlay.show { display: block; }
  .ubox { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px 6px; text-align: center; }
  .utitle { font-size: 22px; text-shadow: 1px 1px 0 #000; } .usrc { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .stageC { position: relative; width: 150px; height: 130px; cursor: pointer; transition: all .4s; display: grid; place-items: center; }
  .stageC .chest { width: 110px; image-rendering: pixelated; filter: drop-shadow(0 0 10px rgba(var(--accent-rgb),.5)); animation: bob 1.4s ease-in-out infinite; }
  .stageC .hint { position: absolute; bottom: -4px; font-size: 15px; color: var(--yellow); animation: pulse 1.2s infinite; }
  .stageC.small { height: 60px; } .stageC.small .chest { width: 56px; }
  .chest.shake { animation: shake .7s linear; }
  @keyframes shake { 10%,30%,50%,70%,90% { transform: translateX(-3px) rotate(-3deg); } 20%,40%,60%,80% { transform: translateX(3px) rotate(3deg); } }
  .chest .lid { transition: transform .35s cubic-bezier(.3,1.6,.5,1); transform-origin: 3px 13px; }
  .chest.open .lid { transform: translate(-2px,-7px) rotate(-28deg); }
  .stageC.burst::before { content: ""; position: absolute; inset: -60px; z-index: -1;
      background: repeating-conic-gradient(from 0deg, rgba(var(--accent-rgb),.35) 0 8deg, transparent 8deg 22deg);
      border-radius: 50%; animation: rays 6s linear infinite, fadeIn .4s; mask: radial-gradient(circle, #000 20%, transparent 70%); }
  @keyframes rays { to { transform: rotate(360deg); } } @keyframes fadeIn { from { opacity: 0; transform: scale(.3); } }
  .reelWrap { position: relative; width: 100%; height: 66px; overflow: hidden; margin-top: 6px; opacity: 0; transition: opacity .3s;
              border-top: 2px solid #000; border-bottom: 2px solid #000; background: linear-gradient(90deg, var(--ink), var(--tile) 30%, var(--tile) 70%, var(--ink)); }
  .reelWrap.show { opacity: 1; }
  .marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--gold); z-index: 2; box-shadow: 0 0 6px var(--gold); transform: translateX(-1px); }
  .reel { display: flex; gap: 4px; padding: 5px 0; will-change: transform; }
  .card { flex: none; width: 42px; height: 54px; border-radius: 3px; border: 1px solid #000; display: flex; flex-direction: column; align-items: center;
          background: linear-gradient(180deg, var(--tile), var(--tile-lo)); box-shadow: inset 0 -3px 0 var(--rc), inset 0 0 0 1px rgba(255,255,255,.08); }
  .card .ci { font-size: 22px; margin-top: 3px; } .card .cn { font-size: 9px; line-height: 1; color: #ddd; padding: 1px; overflow: hidden; height: 18px; }
  .card.winner { transform: scale(1.15); box-shadow: inset 0 -3px 0 var(--rc), 0 0 12px var(--rc), 0 0 0 2px var(--rc); z-index: 3; transition: all .3s; }
  .card.winner.r-extraordinary { animation: rainbow 1s linear infinite; }
  @keyframes rainbow { 0% { box-shadow: 0 0 14px #ff5f5f, 0 0 0 2px #ff5f5f; } 33% { box-shadow: 0 0 14px #ffd84a, 0 0 0 2px #ffd84a; }
                       66% { box-shadow: 0 0 14px #5fd0ff, 0 0 0 2px #5fd0ff; } 100% { box-shadow: 0 0 14px #ff5fd2, 0 0 0 2px #ff5fd2; } }
  .result { opacity: 0; transform: translateY(8px); transition: all .4s; margin-top: 6px; }
  .result.show { opacity: 1; transform: none; }
  .rname { font-size: 24px; text-shadow: 1px 1px 0 #000, 0 0 10px currentColor; letter-spacing: 1px; animation: pop .5s cubic-bezier(.3,1.8,.5,1); }
  .rname.r-extraordinary { background: linear-gradient(90deg, #ff5f5f, #ffd84a, #5fd0ff, #ff5fd2, #ff5f5f); background-size: 200%;
                           -webkit-background-clip: text; color: transparent !important; animation: pop .5s, slide 1.5s linear infinite; }
  @keyframes slide { to { background-position: 200%; } } @keyframes pop { from { transform: scale(.2); } }
  .result .big { font-size: 18px; color: var(--yellow); text-shadow: 1px 1px 0 #000; }
  .result .what { font-size: 14px; color: var(--muted); margin: 2px 0; } .result .bonus { font-size: 14px; color: var(--accent-hi); }
  .btns { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .conf { position: absolute; top: 45%; width: 5px; height: 5px; z-index: 4; animation: conf 1.8s cubic-bezier(.2,.7,.4,1) forwards; }
  @keyframes conf { to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }

  .bag { height: 100%; display: flex; flex-direction: column; padding: 6px; }
  .bagTop { display: flex; gap: 3px; align-items: center; }
  .tab { font-size: 15px; padding: 1px 7px; border: 1px solid #000; border-radius: 3px 3px 0 0; background: var(--stone-lo); color: var(--muted); cursor: pointer; }
  .tab.on { background: var(--tile-hi); color: var(--yellow); } .x { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 14px; } .x:hover { color: var(--yellow); }
  .coins { font-size: 15px; color: var(--yellow); margin: 4px 0; text-shadow: 1px 1px 0 #000; }
  .list { flex: 1; overflow-y: auto; padding-right: 2px; }
  .list::-webkit-scrollbar { width: 5px; } .list::-webkit-scrollbar-thumb { background: var(--tile-hi); }
  .it { display: flex; align-items: center; gap: 5px; padding: 3px 4px; margin-bottom: 2px; border-radius: 3px; background: rgba(255,255,255,.04);
        border-left: 3px solid var(--rc); }
  .it .ii { font-size: 18px; width: 22px; text-align: center; } .it .in { flex: 1; font-size: 14px; line-height: 1.05; color: var(--text); }
  .it small { display: block; font-size: 11px; color: var(--muted-2); } .it.locked { opacity: .45; }
  .mini2 svg { width: 22px; height: 19px; }
  .sec { font-size: 13px; color: var(--orange); margin: 5px 0 2px; } .empty, .qty { font-size: 13px; color: var(--muted-2); }
  .petb { display: inline-block; font-size: 14px; animation: bob 1.1s ease-in-out infinite; }
  .pet { position: absolute; right: 2px; bottom: 4px; font-size: 18px; animation: bob 1.1s ease-in-out infinite; filter: drop-shadow(1px 1px 0 #000); }

  /* ---- pet gear (watch on the pet, a glass of milk beside it) and set auras ---- */
  .petw { position: relative; display: inline-block; padding-right: 8px; animation: bob 1.1s ease-in-out infinite; }  /* room for the watch: the title clips anything outside it */
  .petw .petb { animation: none; }
  .wrist { position: absolute; right: 0; bottom: 1px; font-size: 10px; filter: drop-shadow(0 0 2px var(--rc)) drop-shadow(1px 1px 0 #000); }
  .wrist.solo { position: static; font-size: 12px; }
  .milkg { display: inline-block; font-size: 14px; margin-left: 4px; vertical-align: 1px; filter: drop-shadow(0 0 3px var(--rc)) drop-shadow(1px 1px 0 #000); }
  .fx-ultra { animation: shine 2.2s ease-in-out infinite; }
  .fx-extraordinary { animation: shine 1.2s ease-in-out infinite, wob 2.4s ease-in-out infinite; }
  @keyframes shine { 50% { filter: drop-shadow(0 0 6px var(--rc)) drop-shadow(0 0 2px #fff) brightness(1.35); } }
  @keyframes wob { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .panel.aura { animation: aura 2.6s ease-in-out infinite; }
  /* glows sit inside the edge: the macOS window is cut to the panel, so an outer glow would be clipped away */
  @keyframes aura { 50% { box-shadow: inset 0 0 0 2px var(--aura), inset 0 0 18px var(--aura); } }
  .setp { font-size: 14px; color: var(--muted); margin-top: 3px; } .setp b { color: var(--yellow); }
  .setbonus { font-size: 17px; color: #fff6a0; margin-top: 4px; text-shadow: 1px 1px 0 #000, 0 0 10px var(--gold); animation: glowp 1.4s ease-in-out infinite; }
  .sbar { height: 5px; margin: 1px 0 3px; background: var(--ink); border: 1px solid #000; } .sbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi)); }
  .set { background: rgba(255,255,255,.04); border-radius: 3px; padding: 4px 5px 5px; margin-bottom: 5px; }
  .set .sh { display: flex; justify-content: space-between; font-size: 15px; color: var(--orange); text-shadow: 1px 1px 0 #000; }
  .set .cnt { color: var(--yellow); } .set .bon { font-size: 12px; color: var(--muted); line-height: 1.1; } .set .bon b { color: var(--yellow); font-weight: normal; }
  .icons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 4px; }
  .ic { height: 24px; display: flex; align-items: center; justify-content: center; font-size: 15px; border-radius: 3px;
        background: rgba(0,0,0,.35); border: 1px solid var(--rc); cursor: pointer; }
  .ic:hover { background: rgba(255,255,255,.12); } .ic.miss { opacity: .35; cursor: default; font-size: 11px; }
  .ic.on { box-shadow: 0 0 0 2px var(--yellow); background: rgba(var(--accent-rgb),.18); }
  .set .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; min-height: 16px; }
  .set .cap { font-size: 12px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- level-up takeover ---- */
  .overlay.lvl { cursor: pointer; background: radial-gradient(circle at 50% 38%, #3a2a08 0%, #120c04 55%, var(--ink) 100%); }
  .lvlbox { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 20px; }
  .lvlrays { position: absolute; left: 50%; top: 38%; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%;
             background: repeating-conic-gradient(from 0deg, rgba(var(--accent-rgb),.32) 0 7deg, transparent 7deg 20deg);
             -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); animation: rays 7s linear infinite, fadeIn .5s; }
  .lvlicon { position: relative; font-size: 64px; filter: drop-shadow(0 0 14px rgba(var(--accent-rgb),.9)) drop-shadow(2px 2px 0 #000);
             animation: lvlpop .7s cubic-bezier(.2,1.8,.4,1), lvlbob 1.2s ease-in-out .7s infinite; }
  @keyframes lvlpop { from { transform: scale(0) rotate(-30deg); } }
  @keyframes lvlbob { 50% { transform: translateY(-6px) scale(1.05); } }
  .lvltitle { position: relative; font-size: 40px; line-height: 1; margin-top: 6px; color: #ffe14a; letter-spacing: 2px;
              text-shadow: 2px 2px 0 #000, 0 0 12px #ff9a1f, 0 0 24px #ffd84a; animation: lvlpop .6s cubic-bezier(.2,1.8,.4,1) .15s both, glowp 1.4s ease-in-out infinite; }
  @keyframes glowp { 50% { text-shadow: 2px 2px 0 #000, 0 0 20px #ff9a1f, 0 0 40px #ffd84a; } }
  .lvlskill { position: relative; font-size: 22px; color: var(--orange); text-shadow: 1px 1px 0 #000; margin-top: 4px; }
  .lvlnums { position: relative; font-size: 30px; color: var(--yellow); text-shadow: 2px 2px 0 #000; animation: fadeIn .4s .35s both; }
  .lvlnums .from { opacity: .55; } .lvlnums .to { color: #fff6a0; text-shadow: 2px 2px 0 #000, 0 0 10px #ffd84a; }
  .lvlnext { position: relative; font-size: 15px; color: var(--muted); margin-top: 2px; }
  .lvlchest { position: relative; font-size: 17px; color: #ffd84a; margin-top: 6px; text-shadow: 1px 1px 0 #000; }
  .lvlmore { position: relative; font-size: 14px; color: var(--yellow); margin-top: 6px; }
  .lvlhint { position: absolute; bottom: 8px; font-size: 13px; color: #8a7a5a; animation: pulse 1.4s infinite; }

  /* ---- the lil guy: his room, his body, his moods ---- */
  #buddy { display: none; margin-bottom: 4px; }
  .room { position: relative; height: 92px; border-radius: 3px; border: 1px solid #000; overflow: hidden;
          background: radial-gradient(ellipse at 50% 120%, rgba(var(--accent-rgb),.18), transparent 60%), rgba(var(--ink-rgb),.6);
          box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); touch-action: none; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(180deg, var(--tile-hi), var(--tile-lo)); border-top: 1px solid #000; }
  .bars { position: absolute; left: 4px; top: 4px; width: 62px; display: flex; flex-direction: column; gap: 2px; z-index: 2; }
  .bbar { display: flex; align-items: center; gap: 2px; font-size: 8px; line-height: 1; }
  .bbar b { flex: 1; height: 4px; background: var(--ink); border: 1px solid #000; position: relative; }
  .bbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, var(--xp-a), var(--xp-b)); transition: width .5s; }
  .bbar.low i { background: linear-gradient(180deg, #ff7a6a, #c22a1a); animation: pulse 1s infinite; }
  .tools { position: absolute; right: 4px; top: 4px; display: flex; flex-direction: column; gap: 3px; z-index: 2; }
  .tool { position: relative; width: 26px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: grab;
          border-radius: 4px; border: 1px solid #000; background: linear-gradient(180deg, var(--tile-hi), var(--tile)); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
  .tool:hover { filter: brightness(1.2); } .tool.dis { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  .tool b { position: absolute; right: -3px; bottom: -3px; font-size: 10px; font-weight: normal; color: var(--accent-ink); background: var(--accent);
            border: 1px solid #000; border-radius: 6px; min-width: 11px; height: 11px; line-height: 10px; text-align: center; }
  .guy { position: absolute; left: 0; bottom: 9px; width: 46px; height: 46px; cursor: pointer; z-index: 1; }
  .gbody { width: 46px; height: 46px; transform-origin: 50% 100%; }
  .gsvg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(1px 1px 0 #000); }
  .gsvg .body, .gsvg .foot, .gsvg .arm { fill: var(--accent); stroke: #2a1608; stroke-width: 1.5; }
  .gsvg .foot, .gsvg .arm { fill: var(--accent-lo); }
  .gsvg .cheek { opacity: 0; transition: opacity .4s; } .happy .gsvg .cheek { opacity: .8; }
  .gsvg .lids rect { fill: var(--accent); transform: scaleY(0); transform-box: fill-box; transform-origin: 50% 0; transition: transform .08s; }
  .gsvg .lids.blink rect { transform: scaleY(1.3); } .gsvg .lids.sleepy rect { transform: scaleY(.7); }
  .gsvg .arm { transform-box: fill-box; transform-origin: 50% 80%; transition: transform .3s; }
  .flexing .gsvg .al { transform: rotate(50deg) translateY(-6px); } .flexing .gsvg .ar { transform: rotate(-50deg) translateY(-6px); }
  .shadow { position: absolute; left: 8px; right: 8px; bottom: -3px; height: 5px; border-radius: 50%; background: rgba(0,0,0,.45); }
  .guy.weak .gsvg { filter: grayscale(.6) brightness(.8) drop-shadow(1px 1px 0 #000); }
  .guy.strong .gsvg { filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(1px 1px 0 #000); }
  .guy.shake .gbody { animation: shake .12s 4; } @keyframes shake { 25% { margin-left: -3px; } 75% { margin-left: 3px; } }
  .fly { display: none; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #111; box-shadow: 0 0 1px #fff; }
  .guy.filthy .fly { display: block; } .fly.f1 { left: 4px; top: 4px; animation: fly1 1.3s linear infinite; } .fly.f2 { right: 4px; top: 10px; animation: fly1 1.7s linear infinite reverse; }
  @keyframes fly1 { 25% { transform: translate(10px, -6px); } 50% { transform: translate(20px, 2px); } 75% { transform: translate(8px, 8px); } }
  .think { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); font-size: 13px; animation: bob 1.6s ease-in-out infinite; z-index: 2; }
  .ghost { position: fixed; left: 0; top: 0; font-size: 20px; pointer-events: none; z-index: 30; filter: drop-shadow(1px 2px 0 rgba(0,0,0,.6)); }
  .foam { position: fixed; width: var(--s); height: var(--s); border-radius: 50%; pointer-events: none; z-index: 29;
          background: radial-gradient(circle at 35% 35%, #fff, rgba(220,240,255,.7) 60%, rgba(180,220,255,.3)); animation: foam .9s ease-out both; }
  @keyframes foam { from { transform: scale(.3); } 60% { opacity: 1; } to { transform: translateY(-8px) scale(1.2); opacity: 0; } }
  .bfx { position: absolute; bottom: 30px; font-size: 12px; pointer-events: none; animation: bfx 1.6s ease-out both; }
  @keyframes bfx { from { opacity: 1; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), -40px) scale(1.25); } }

  /* ---- skin effects: a layer over the panel that never takes clicks ---- */
  .panel { position: relative; }
  #fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 6px; z-index: 4; }
  #fx i { position: absolute; display: block; border-radius: 50%; }
  .fx-snow i { top: -6px; width: var(--s); height: var(--s); background: #fff; opacity: .75; box-shadow: 0 0 3px #fff;
               animation: snow var(--d) linear var(--w) infinite; }
  @keyframes snow { to { transform: translate(var(--dx), 340px); } }
  .fx-embers i { bottom: -6px; width: calc(var(--s) + 1px); height: calc(var(--s) + 1px); background: #fff3c4; box-shadow: 0 0 6px 2px #ff7a1a, 0 0 2px #fff;
                 animation: ember var(--d) ease-out var(--w) infinite; opacity: 0; }
  @keyframes ember { 8% { opacity: 1; } 100% { transform: translate(var(--dx), -420px) scale(.4); opacity: 0; } }
  .fx-mist i { width: 160px; height: 70px; background: radial-gradient(closest-side, rgba(200,150,255,.35), transparent); filter: blur(6px);
               animation: mist var(--d) ease-in-out var(--w) infinite alternate; }
  @keyframes mist { from { transform: translateX(-90px); } to { transform: translateX(150px); } }
  .fx-shimmer::after { content: ""; position: absolute; inset: -40% -60%; background: linear-gradient(115deg, transparent 42%, rgba(255,246,200,.28) 50%, transparent 58%);
                       animation: shimmer 4.5s ease-in-out infinite; }
  @keyframes shimmer { 0%, 30% { transform: translateX(-60%); } 70%, 100% { transform: translateX(60%); } }
  .fx-shimmer i { width: 4px; height: 4px; background: #fff; box-shadow: 0 0 6px 2px #ffe58a, 0 0 12px #fff1a8; top: var(--y); animation: twinkle var(--d) ease-in-out var(--w) infinite; opacity: 0; }
  @keyframes twinkle { 50% { opacity: 1; transform: scale(1.6); } }
  .panel.neon { animation: neon 3.2s steps(1) infinite; }
  .panel.neon .title { animation: neontxt 3.2s steps(1) infinite; }
  @keyframes neon { 0%, 100% { box-shadow: inset 0 0 0 2px #ff4fd8, inset 0 0 16px rgba(255,79,216,.7); }
                    47% { box-shadow: inset 0 0 0 2px #3ff0ff, inset 0 0 14px rgba(63,240,255,.7); }
                    49% { box-shadow: inset 0 0 0 1px rgba(255,79,216,.3); } 51% { box-shadow: inset 0 0 0 2px #ff4fd8, inset 0 0 18px rgba(255,79,216,.8); } }
  @keyframes neontxt { 0%, 100% { text-shadow: 1px 1px 0 #000, 0 0 8px #ff4fd8; } 48% { text-shadow: 1px 1px 0 #000; } 52% { text-shadow: 1px 1px 0 #000, 0 0 10px #3ff0ff; } }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="bar"><span class="title" id="title">Skills</span><span class="right"><span id="chips"></span><span class="btn" id="fold" title="Fold">▾</span></span></div>
  <div id="tray"></div>
  <div id="buddy"></div>
  <div class="grid" id="grid"></div>
  <div class="info inset" id="info"></div>
  <div id="fx"></div>
</div>
<div class="banner" id="banner"></div>
<div class="overlay" id="overlay"></div>
<script src="loot.js"></script>
<script src="buddy.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const post = (msg) => window.webkit?.messageHandlers?.panel?.postMessage(msg);
  let stats = null, hovered = null, known = null, knownChests = null;

  // ---- info box ----
  function skillInfo(s) {
    const max = s.next_xp == null, pct = max ? 100 : (100 * (s.xp - s.level_xp)) / (s.next_xp - s.level_xp);
    return `<div class="name">${s.icon} ${s.name}</div>
      <div class="row"><span>${s.name} XP:</span><span>${fmt(s.xp)}</span></div>
      ${max ? "" : `<div class="row"><span>Next level at:</span><span>${fmt(s.next_xp)}</span></div>
      <div class="row"><span>Remaining XP:</span><span>${fmt(s.next_xp - s.xp)}</span></div>`}
      <div class="row"><span>Today:</span><span>+${fmt(s.today_xp)}</span></div>
      <div class="xpbar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="about">${s.about}</div>`;
  }
  function overview() {
    const today = stats.skills.reduce((a, x) => a + x.today_xp, 0);
    const best = [...stats.skills].sort((a, b) => b.today_xp - a.today_xp)[0];
    return `<div class="name">Total level: ${stats.total_level}</div>
      <div class="row"><span>Total XP:</span><span>${fmt(stats.total_xp)}</span></div>
      <div class="row"><span>XP today:</span><span>${fmt(today)}</span></div>
      <div class="row"><span>Best today:</span><span>${best && best.today_xp ? best.icon + " " + best.name : "-"}</span></div>
      ${stats.streak ? `<div class="row"><span>Streak:</span><span>🔥 ${stats.streak.days} days${stats.streak.today_done ? " ✓" : ""}</span></div>` : ""}`;
  }
  const infoFor = (key) => {
    const [kind, id] = (key || "").split(":");
    const s = stats.skills.find((x) => x.id === id);
    return !s ? overview() : skillInfo(s);
  };
  function paintInfo() { $("info").innerHTML = (typeof infoOverride === "string" && infoOverride) || infoFor(hovered); }

  // Reserve room for the tallest hover text so hovering never resizes or clips the panel.
  function reserveInfoHeight() {
    const box = $("info");
    box.style.minHeight = "0";
    let tallest = 0;
    for (const key of [null, ...stats.skills.map((s) => "skill:" + s.id)]) {
      box.innerHTML = infoFor(key);
      tallest = Math.max(tallest, box.getBoundingClientRect().height);
    }
    box.style.minHeight = Math.ceil(tallest) + "px";
  }
  function hover(el, key) { el.onmouseenter = () => { hovered = key; paintInfo(); }; el.onmouseleave = () => { hovered = null; paintInfo(); }; }

  // ---- render ----
  function render(data) {
    stats = data;
    const ups = [];
    if (known) for (const s of data.skills) if (known[s.id] && s.level > known[s.id]) ups.push({ s, from: known[s.id] });
    const chestIds = (data.loot?.unopened || []).map((c) => c.id);
    const newChests = knownChests ? chestIds.filter((id) => !knownChests.includes(id)).length : 0;
    knownChests = chestIds;
    known = Object.fromEntries(data.skills.map((s) => [s.id, s.level]));

    if (window.Loot) Loot.render(data);
    if (window.Buddy) Buddy.render(data);
    paintHeading();

    const upIds = ups.map((u) => u.s.id);
    $("grid").innerHTML = data.skills.map((s) => `
      <div class="tile ${upIds.includes(s.id) ? "levelup" : ""}" data-id="${s.id}">
        <span class="icon">${s.icon}</span>
        <span class="lv"><span class="a">${s.level}</span><span class="slash"></span><span class="b">${s.level}</span></span>
        ${s.today_xp > 0 ? '<span class="today"></span>' : ""}
      </div>`).join("") + `<div class="tile total"><span class="k">Total level:</span><span class="v">${data.total_level}</span></div>`;

    document.querySelectorAll(".tile[data-id]").forEach((t) => hover(t, "skill:" + t.dataset.id));
    reserveInfoHeight();
    paintInfo();
    const stale = Date.now() - Date.parse(data.updated) > 10 * 60 * 1000;
    if (stale) $("title").textContent = "⚠ not updating";
    if (ups.length) celebrate(ups, newChests);
    else if (newChests) chestDropped(newChests);
    fit();
  }

  // ---- level-up and new-chest moments: the window jumps, the panel celebrates ----
  let actx = null;
  function audio() {
    actx = actx || new AudioContext();
    if (actx.state !== "running") actx.resume();
    return actx;
  }
  function note(f, t0, dur, type = "square", vol = 0.05) {
    const c = audio(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function play(seq, fallback) {
    try { seq(); } catch (e) {}
    // if the page is not allowed to make sound, the app plays a system sound instead
    setTimeout(() => { if (!actx || actx.state !== "running") post({ type: "sound", name: fallback }); }, 250);
  }
  const FANFARE = () => {
    [392, 523, 659, 784].forEach((f, i) => note(f, i * 0.11, 0.18));
    [[1047, 0.5], [988, 0.62], [1047, 0.74]].forEach(([f, t]) => note(f, t, 0.14));
    [523, 659, 784, 1047].forEach((f) => note(f, 0.9, 1.3, "triangle", 0.045));
    note(1568, 0.9, 1.1, "square", 0.02);
  };
  const CHEST_CHIME = () => [784, 1047, 1319, 1568].forEach((f, i) => note(f, i * 0.07, 0.25, "triangle", 0.05));

  function celebrate(ups, chests = 0) {
    post({ type: "hop", heights: [34, 20, 9] });
    play(FANFARE, "Hero");
    const ov = $("overlay");
    if (ov.classList.contains("show")) {  // mid-unboxing: don't steal the screen, show a banner
      const { s } = ups[0];
      window.banner(`<div class="big">🎉 Level up! 🎉</div>${s.icon} ${s.name} is now level ${s.level}.${chests ? " 🎁 +" + chests + " chest" : ""}`);
      return;
    }
    const main = ups[0], s = main.s, more = ups.slice(1);
    const toNext = s.next_xp == null ? "Max level!" : `${fmt(s.next_xp - s.xp)} XP to level ${s.level + 1}`;
    ov.className = "overlay show lvl";
    ov.innerHTML = `<div class="lvlbox">
      <div class="lvlrays"></div>
      <div class="lvlicon">${s.icon}</div>
      <div class="lvltitle">LEVEL UP!</div>
      <div class="lvlskill">${s.name}</div>
      <div class="lvlnums"><span class="from">${main.from}</span> ➜ <span class="to">${s.level}</span></div>
      <div class="lvlnext">${toNext}</div>
      ${chests ? `<div class="lvlchest">🎁 +${chests} chest${chests > 1 ? "s" : ""} in your tray</div>` : ""}
      ${more.length ? `<div class="lvlmore">${more.map((u) => `${u.s.icon} ${u.s.name} ${u.s.level}`).join(" · ")}</div>` : ""}
      <div class="lvlhint">click to continue</div></div>`;
    lvlConfetti(ov, 110);
    const close = () => { clearTimeout(timer); ov.onclick = null; ov.className = "overlay"; ov.innerHTML = ""; };
    const timer = setTimeout(close, 6000);
    ov.onclick = close;
  }

  function chestDropped(n) {
    post({ type: "hop", heights: [16] });
    play(CHEST_CHIME, "Glass");
    window.banner(`<div class="big">🎁 New chest!</div>${n > 1 ? n + " chests are" : "A chest is"} waiting in your tray.`);
  }

  function lvlConfetti(ov, n) {
    const colors = ["#ffd84a", "#ff9a1f", "#fff6c2", "#ff5fd2", "#7fe3ff", "#3fd16a"];
    for (let i = 0; i < n; i++) {
      const p = document.createElement("i");
      p.className = "conf";
      p.style.left = 50 + (Math.random() - 0.5) * 30 + "%";
      p.style.top = "38%";
      p.style.background = colors[i % colors.length];
      p.style.width = p.style.height = 3 + Math.random() * 5 + "px";
      p.style.setProperty("--dx", (Math.random() - 0.5) * 380 + "px");
      p.style.setProperty("--dy", (Math.random() - 0.7) * 380 + "px");
      p.style.animationDelay = Math.random() * 0.4 + "s";
      ov.appendChild(p);
      setTimeout(() => p.remove(), 2600);
    }
  }

  function fit() { requestAnimationFrame(() => post({ type: "size", height: Math.ceil($("panel").getBoundingClientRect().height) })); }
  $("fold").onclick = () => { document.body.classList.toggle("compact"); $("fold").textContent = document.body.classList.contains("compact") ? "▸" : "▾"; fit(); };
  window.render = render;
  // dev: replay a level-up on the first skill without touching real data
  window.testLevelUp = (withChest) => { if (withChest) knownChests = []; known[stats.skills[0].id] = stats.skills[0].level - 1; render(stats); };
  window.testChest = () => { knownChests = []; render(stats); };
  let infoOverride = null;
  window.showInfoHTML = (html) => { infoOverride = html; paintInfo(); };
  // heading: your equipped title (or "Skills") with your pet beside it
  // plus the watch your pet wears and its glass of milk; the equipped skin and aura restyle the panel
  const SKIN_VARS = ["stone-hi", "stone", "stone-end", "stone-lo", "tile-hi", "tile", "tile-end", "tile-lo", "orange", "text", "yellow",
    "accent", "accent-rgb", "accent-hi", "accent-lo", "accent-ink", "ink", "ink-rgb", "muted", "muted-2", "xp-a", "xp-b", "bar-bg", "bar-edge"];
  // the rare skins move: particles (snow, embers, mist, sparkles) or a flickering neon edge
  let fxNow = null;
  function paintFx(effect) {
    if (effect === fxNow) return;
    fxNow = effect;
    const fx = $("fx"), r = (a, b) => a + Math.random() * (b - a);
    $("panel").classList.toggle("neon", effect === "neon");
    fx.className = effect && effect !== "neon" ? "fx-" + effect : "";
    const n = { snow: 26, embers: 18, mist: 4, shimmer: 10 }[effect] || 0;
    fx.innerHTML = Array.from({ length: n }, () => `<i style="left:${r(-5, 100)}%;top:${effect === "mist" ? r(-10, 80) + "%" : ""};--y:${r(0, 95)}%;
      --s:${r(1.5, 3.5)}px;--d:${r(effect === "mist" ? 9 : 3.5, effect === "mist" ? 16 : 8)}s;--w:-${r(0, 8)}s;--dx:${r(-25, 25)}px"></i>`).join("");
  }
  function paintHeading() {
    const eq = window.Loot ? Loot.equipped() : {}, D = (id) => Loot.drop(id);
    const gear = (id, cls, glyph) => { const d = D(id); return `<span class="${cls} fx-${d.rarity}" style="--rc:${Loot.rarityColor(d.rarity)}" title="${d.name}">${glyph}</span>`; };
    let h = eq.title ? D(eq.title).name.replace("Title: ", "") : "Skills";
    if (eq.pet) h += ` <span class="petw"><span class="petb">${D(eq.pet).icon}</span>${eq.watch ? gear(eq.watch, "wrist", "⌚") : ""}</span>`;
    else if (eq.watch) h += " " + gear(eq.watch, "wrist solo", "⌚");
    if (eq.milk) h += gear(eq.milk, "milkg", "🥛");
    $("title").innerHTML = h;
    const root = document.documentElement.style, vars = eq.skin ? D(eq.skin).vars || {} : {};
    SKIN_VARS.forEach((k) => (vars[k] ? root.setProperty("--" + k, vars[k]) : root.removeProperty("--" + k)));
    paintFx(eq.skin ? D(eq.skin).effect : null);
    const aura = eq.aura ? Loot.auraColor(eq.aura) : null;
    $("panel").classList.toggle("aura", !!aura);
    if (aura) root.setProperty("--aura", aura); else root.removeProperty("--aura");
  }
  $("title").onmouseenter = () => window.Loot && window.showInfoHTML(Loot.bonusInfo());
  $("title").onmouseleave = () => window.showInfoHTML(null);
  window.repaintHero = paintHeading;
  window.banner = (html) => { $("banner").innerHTML = html; $("banner").classList.add("show"); setTimeout(() => $("banner").classList.remove("show"), 5000); };
  document.fonts.ready.then(() => { if (stats) { reserveInfoHeight(); paintInfo(); fit(); } });  // font changes text height
  window.showInfo = (key) => { hovered = key; paintInfo(); };
  post({ type: "ready" });
</script>
</body>
